{% extends "accounts/base.html" %}
{% block content %}
<section class="hero">
  <h1>Історія України</h1>
  <p>Навчальна платформа з підтвердженням пошти та захищеним доступом до облікового запису.</p>
  {% if user.is_authenticated %}
  <a class="button" href="{% url 'profile' %}">Відкрити профіль</a>
  {% else %}
  <a class="button" href="{% url 'register' %}">Створити акаунт</a>
  <a class="secondary" href="{% url 'login' %}">У мене вже є акаунт</a>
  {% endif %}
</section>
{% endblock %}
